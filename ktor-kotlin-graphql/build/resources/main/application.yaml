ktor:
  development: false
  deployment:
    port: 8080    
  application:
    modules:
      - com.api.ApplicationKt.module
      - com.postgres.amqp.RequestValidationKt.configureRequestValidation
      - com.postgres.amqp.ExposedKt.configureExposed
      - com.postgres.amqp.RabbitmqKt.configureRabbitmq
      - com.api.ApplicationKt.configureSecurity    

rabbitmq:
  uri: "amqp://guest:guest@localhost:5672"
  name: "ktor-consumer"
