ktor:
  development: false
  deployment:
    port: 8080    
    watch:
      - classes
      - resources    
  application:
    modules:
      - com.api.ApplicationKt.module
      - com.postgres.amqp.RequestValidationKt.configureRequestValidation
      - com.postgres.amqp.ExposedKt.configureExposed
      - com.postgres.amqp.RabbitmqKt.configureRabbitmq
      - com.api.ApplicationKt.configureSecurity    

jwt:
    secret: ${JWT_SECRET:-my_temporary_local_development_secret_key}
    issuer: "http://127.0.0.1:8080"
    audience: "http://127.0.0.1:8080/main"
    realm: "Access to 'main'"

storage:
  driverClassName: "com.mysql.cj.jdbc.Driver"
  jdbcUrl: "jdbc:mysql://127.0.0.1:3306/ktor_kotlin"
  user: "rey"
  password: "rey"


rabbitmq:
  uri: "amqp://guest:guest@localhost:5672"
  name: "ktor-consumer"
